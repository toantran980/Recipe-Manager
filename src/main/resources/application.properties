# Common settings — shared across all environments
spring.application.name=recipemanager
server.port=${PORT:8080}

# MongoDB — default for local dev; override via env var
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/recipe}

# JWT — secret must be set via env var or profile-specific file
# (Base64-encoded 256-bit key). No fallback — app fails fast if missing.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Active profile — override at runtime via SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Boot Actuator — health monitoring
# Expose only health and info endpoints
management.endpoints.web.exposure.include=health,info
# Show full health details
management.endpoint.health.show-details=always
