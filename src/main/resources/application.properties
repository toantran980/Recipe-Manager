# =============================================
# Common settings — shared across all environments
# =============================================
spring.application.name=recipemanager
server.port=${PORT:8080}

# MongoDB — default for local dev; override via env var
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/recipe}

# Redis — default for local dev; override via env var
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT — default for local dev; override via env var
jwt.secret=${JWT_SECRET:change-me-placeholder-32-chars-minimum-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Active profile — override at runtime via SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# Spring Boot Actuator — health monitoring
# =============================================
# Expose only health and info endpoints (NEVER expose '*' in production)
management.endpoints.web.exposure.include=health,info
# Show full health details (MongoDB, disk space, etc.)
management.endpoint.health.show-details=always
