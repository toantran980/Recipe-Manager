# Common settings — shared across all environments

spring.application.name=recipemanager
server.port=${PORT:8080}

# PostgreSQL — default for local dev; override via env var
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recipe}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=RecipeManagerHikariCP

# Redis — default for local dev; override via env var
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT — default for local dev; override via env var
jwt.secret=${JWT_SECRET:change-me-placeholder-32-chars-minimum-secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Active profile — override at runtime via SPRING_PROFILES_ACTIVE env var
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Spring Boot Actuator — health monitoring

# Expose only health and info endpoints (NEVER expose '*' in production)
management.endpoints.web.exposure.include=health,info
# Show full health details (database, disk space, etc.)
management.endpoint.health.show-details=always

# File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}