# Development — local machine only
# This file is safe to commit since it contains dev-only values

spring.datasource.url=jdbc:postgresql://localhost:5432/recipe
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Base64-encoded 256-bit key (valid for Decoders.BASE64.decode)
jwt.secret=secret-dev-key-12345678901234567890123456789012

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.root=DEBUG