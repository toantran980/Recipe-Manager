# Production — values from environment variables only
# This file is in .gitignore and NEVER committed

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT secret (Base64-encoded 256-bit key)
jwt.secret=${JWT_SECRET}

# Logging — production level (errors only)
logging.level.root=ERROR
logging.level.com.example.recipemanager=INFO


# Enable OpenAPI/Swagger in production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info,openapi
management.endpoint.health.show-details=always

# Port (required for Render)
server.port=${PORT:8080}