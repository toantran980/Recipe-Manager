services:
  - type: web
    name: recipe-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Set SPRING_DATA_MONGODB_URI in Render dashboard to your MongoDB Atlas URI
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      # Set JWT_SECRET in Render dashboard manually using the same value from your .env file
      - key: JWT_SECRET
        sync: false
      # Set REDIS_HOST in Render dashboard to your Redis instance URL
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
