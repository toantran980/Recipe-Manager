services:
  - type: pserv
    name: recipe-manager-db
    runtime: postgresql
    plan: free
    postgresMajorVersion: 16
    databaseName: recipe
    user: recipe_user

  - type: web
    name: recipe-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: recipe-manager-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: recipe-manager-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: recipe-manager-db
          property: password
      # Set JWT_SECRET in Render dashboard manually
      - key: JWT_SECRET
        sync: false
      # Redis (create a Redis instance in Render and link here)
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379