name: CI — Run Tests and Build Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recipe
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ 5432:5432 ]
        options: >-
          --health-cmd "pg_isready -U postgres -d recipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: [ 6379:6379 ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests
        run: mvn --batch-mode clean test

      - name: Build Docker image
        run: docker build -t recipe-api:${{ github.sha }} .